# ME Agent deploy pilot (Test Deploy page) — copies the installer straight
# from this backend server's own local disk to each target over its normal
# WinRM/SSH connection, then runs it. Two separate plays so one
# ansible-playbook invocation covers whichever OS groups actually have hosts
# in this run's inventory (an empty group is simply skipped, no error).
#
# windows_share_path / linux_share_path (Test Deploy Config's field names,
# kept as-is to avoid a DB migration) are now just a local directory on THIS
# backend server containing that OS's installer — win_copy/copy read them
# straight off this machine's disk and push the file over the same
# WinRM/SSH connection already used for everything else, so there's no
# separate network share, no CIFS mount, and no WinRM double-hop to work
# around. (An earlier version of this playbook went through a source file
# server's admin share instead, which needed exactly that workaround — see
# git history if that's ever needed again.)
#
# Every win_shell task below uses the explicit `cmd:` sub-parameter instead
# of the free_form shorthand (`win_shell: |` directly). Ansible's free_form
# parsing runs the whole command through a shlex-like argument splitter (to
# separate the command from modifiers like chdir=/creates=), and that
# splitter can misread a backslash sitting right before a closing quote
# (e.g. "\\") as an escaped quote rather than an escaped backslash —
# producing "failed at splitting arguments, unbalanced jinja2 block or
# quotes" even though the YAML/PowerShell itself is fine. cmd: bypasses that
# splitter entirely (plain templated string, passed straight to the
# module), which is the documented fix for exactly this failure mode —
# needed here since these commands are full of literal backslashes.
# win_copy itself isn't affected by this at all — src/dest are structured
# module parameters, not a shell command line.
#
# install_cmd is a per-host inventory var (Test Deploy Config, resolved per
# location) — a PLACEHOLDER until the real silent-install switches for the
# ME Agent installer are filled in there.
#
# check_only=true (passed via --extra-vars) runs the copy step but skips
# the actual install task — used by Test Deploy's per-VM "Verify" action to
# prove the file transfer will succeed without deploying anything yet.
#
# The "Report OS details" task is failed_when: false — its job is only to
# surface diagnostic info via the "OSINFO::" debug line the Node side
# parses out of this run's output; it must never affect the copy/install
# task's own pass/fail status.
---
- name: Deploy ME Agent — Windows targets
  hosts: windows
  gather_facts: false
  tasks:
    - name: Report OS details
      ansible.windows.win_shell:
        cmd: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Output "$($os.Caption)::$($os.Version)"
      register: os_info
      failed_when: false
      changed_when: false

    - name: Show OS details
      ansible.builtin.debug:
        msg: "OSINFO::{{ (os_info.stdout | default('unknown')) | trim }}"

    - name: Fail early if windows_share_path isn't a local directory path on this server
      ansible.builtin.fail:
        msg: >-
          windows_share_path ("{{ share_path | default('') }}") must be an absolute directory path
          on THIS backend server (e.g. /opt/inventory/installers/windows) containing the Windows
          installer — win_copy reads it straight off local disk, no network share needed. Fix it
          in Test Deploy Config for this location (or the Default config).
      when: not (share_path | default('') | string).startswith('/')

    - name: Create the destination directory on the target
      ansible.windows.win_file:
        path: 'C:\Temp'
        state: directory

    - name: Copy installer to the target
      ansible.windows.win_copy:
        src: "{{ share_path }}/{{ installer_file }}"
        dest: 'C:\Temp\{{ installer_file }}'
      register: copy_result

    - name: Run the ME Agent installer
      ansible.windows.win_shell:
        cmd: |
          & "C:\Temp\{{ installer_file }}" {{ install_cmd | default('/PLACEHOLDER_SILENT_SWITCHES', true) }}
      register: install_result
      when: not (check_only | default(false) | bool)

- name: Deploy ME Agent — Linux targets
  hosts: linux
  gather_facts: false
  become: true
  tasks:
    - name: Report OS details
      ansible.builtin.shell:
        cmd: |
          . /etc/os-release 2>/dev/null; echo "${PRETTY_NAME:-$(uname -s)}::$(uname -r)"
      register: os_info
      failed_when: false
      changed_when: false

    - name: Show OS details
      ansible.builtin.debug:
        msg: "OSINFO::{{ (os_info.stdout | default('unknown')) | trim }}"

    - name: Fail early if linux_share_path isn't a local directory path on this server
      ansible.builtin.fail:
        msg: >-
          linux_share_path ("{{ share_path | default('') }}") must be an absolute directory path
          on THIS backend server (e.g. /opt/inventory/installers/linux) containing the Linux
          installer — ansible.builtin.copy reads it straight off local disk, no CIFS mount needed.
          Fix it in Test Deploy Config for this location (or the Default config).
      when: not (share_path | default('') | string).startswith('/')

    - name: Copy installer to /tmp
      ansible.builtin.copy:
        src: "{{ share_path }}/{{ installer_file }}"
        dest: "/tmp/{{ installer_file }}"
        mode: '0755'
      register: copy_result

    - name: Copy serverinfo.json to /tmp
      ansible.builtin.copy:
        src: "{{ share_path }}/{{ serverinfo_file }}"
        dest: "/tmp/{{ serverinfo_file }}"
      register: copy_serverinfo_result
      when: (serverinfo_file | default('')) | length > 0

    - name: Run the ME Agent installer
      # Runs from /tmp (not by absolute path) so the installer finds
      # serverinfo.json — copied into the same directory above — via its
      # own working-directory lookup, same convention as Software Status's
      # own Linux install. Confirmed: the UEMS Linux installer needs NO
      # flags at all — it auto-detects serverinfo.json alongside it and
      # installs silently on its own; it doesn't even support GNU-style
      # --long-options, only a handful of single-dash ones (e.g. -d). So
      # unlike Windows, an empty install_cmd here is the CORRECT default,
      # not an unconfigured placeholder — never substitute one.
      ansible.builtin.shell:
        cmd: |
          cd /tmp && ./{{ installer_file }} {{ install_cmd | default('', true) }}
      register: install_result
      when: not (check_only | default(false) | bool)
