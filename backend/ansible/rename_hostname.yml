# Renames a server's OS-level hostname to the value already saved in its
# inventory record (the "Assign this hostname" checkbox on the Assets /
# Beijing Assets / Ext. Assets / Physical & ESXi Servers forms) — see
# backend/src/controllers/hostnameRenameController.js, which reads the target
# hostname back out of the DB rather than trusting a value from the request,
# and backend/src/utils/ansibleHostnameRename.js, which runs this playbook.
#
# new_hostname arrives via --extra-vars; it is never written to disk here.
#
# Windows only fully applies a hostname change after a reboot, so win_reboot
# reboots it automatically here (admin-requested behavior — the alternative
# of leaving it pending was considered and deliberately rejected in favor of
# the rename completing in one step). Gated on win_rename.changed so a rename
# that's a no-op (already had this hostname) never reboots the server.
# win_reboot blocks until the host is back and reachable, so this playbook —
# and the /hostname-rename request awaiting it — can take several minutes for
# Windows targets.
---
- name: Rename hostname — Windows targets
  hosts: windows
  gather_facts: false
  tasks:
    - name: Set the Windows hostname
      ansible.windows.win_hostname:
        name: "{{ new_hostname }}"
      register: win_rename

    - name: Reboot to finish applying the new hostname
      ansible.windows.win_reboot:
        reboot_timeout: 600
      when: win_rename.changed

    - name: Report whether the server was rebooted
      ansible.builtin.debug:
        msg: "REBOOTED::{{ win_rename.changed | default(false) }}"

- name: Rename hostname — Linux targets
  hosts: linux
  gather_facts: false
  become: true
  tasks:
    - name: Set the Linux hostname
      ansible.builtin.hostname:
        name: "{{ new_hostname }}"
      register: linux_rename

    # The hostname itself is already live at this point (the module applies
    # it immediately) — this only restarts the daemon that reports/watches it,
    # per explicit request.
    - name: Restart systemd-hostnamed to pick up the new hostname
      ansible.builtin.systemd:
        name: systemd-hostnamed
        state: restarted
      when: linux_rename.changed
