# ManageEngine UEMS Agent uninstall — Windows targets only (Software Status
# "Reinstall"). Finds the agent's entry in the Windows uninstall registry keys
# and removes it silently, elevated (runas as SYSTEM), then waits for the
# service to disappear. The install step afterwards reuses me_agent_windows.yml.
---
- name: Uninstall the ManageEngine UEMS Agent
  hosts: windows
  gather_facts: false

  vars:
    me_service_name: 'ManageEngine UEMS - Agent'

  tasks:
    - name: Check if the ManageEngine UEMS Agent service exists
      ansible.windows.win_service_info:
        name: "{{ me_service_name }}"
      register: me_service_before

    - name: Uninstall the agent
      when: me_service_before.exists | default(false)
      become: true
      become_method: ansible.builtin.runas
      become_user: SYSTEM
      block:
        - name: Find the agent's uninstall command in the registry
          ansible.windows.win_shell:
            _raw_params: |
              $keys = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
              $all = Get-ItemProperty $keys -ErrorAction SilentlyContinue
              $pat = 'UEMS|ManageEngine|Desktop\s*Central|Endpoint\s*Central|Zoho|DCAgent'
              $cands = @($all | Where-Object {
                $_.DisplayName -and ($_.DisplayName -match $pat -or $_.Publisher -match 'Zoho|ManageEngine')
              })
              # Prefer an entry that looks like the agent itself over the server/other tools.
              $e = $cands | Where-Object { $_.DisplayName -match 'agent' } | Select-Object -First 1
              if (-not $e) { $e = $cands | Select-Object -First 1 }
              if ($e) {
                if ($e.PSChildName -match '^\{[0-9A-Fa-f-]+\}$') { Write-Output ("MSI::" + $e.PSChildName); exit 0 }
                if ($e.UninstallString) { Write-Output ("EXE::" + $e.UninstallString); exit 0 }
              }
              # Fallback 1: the agent is often not listed in Programs and Features,
              # but is still an installed MSI package — ask Windows Installer.
              $p = Get-CimInstance Win32_Product -Filter "Name like '%UEMS%' and Name like '%Agent%'" -ErrorAction SilentlyContinue |
                   Select-Object -First 1
              if ($p -and $p.IdentifyingNumber) { Write-Output ("MSI::" + $p.IdentifyingNumber); exit 0 }
              # Fallback 2: an uninstaller shipped in the agent's own folder.
              foreach ($d in 'C:\Program Files (x86)\ManageEngine\UEMS_Agent','C:\Program Files\ManageEngine\UEMS_Agent') {
                if (-not (Test-Path $d)) { continue }
                $u = Get-ChildItem $d -Recurse -Include 'uninst*.exe','unins*.exe','*uninstall*.exe','Remove*.exe' -ErrorAction SilentlyContinue |
                     Select-Object -First 1
                if ($u) { Write-Output ('EXE::"' + $u.FullName + '"'); exit 0 }
              }
              Write-Output 'NOT_FOUND'
          register: me_uninst_lookup
          changed_when: false

        - name: Gather diagnostics when no uninstall entry was found
          ansible.windows.win_shell:
            _raw_params: |
              "--- agent service ---"
              Get-CimInstance Win32_Service -Filter "Name like '%UEMS%' or DisplayName like '%UEMS%' or DisplayName like '%ManageEngine%'" |
                Select-Object Name, DisplayName, PathName | Format-List | Out-String
              "--- agent install folders ---"
              Get-ChildItem 'C:\Program Files (x86)\ManageEngine','C:\Program Files\ManageEngine' -ErrorAction SilentlyContinue |
                Select-Object FullName | Format-Table -HideTableHeaders | Out-String
              "--- executables in the agent folder ---"
              Get-ChildItem 'C:\Program Files (x86)\ManageEngine\UEMS_Agent' -Recurse -Include *.exe,*.bat,*.cmd,*.ps1 -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName | Out-String
              "--- MSI packages mentioning UEMS ---"
              Get-CimInstance Win32_Product -Filter "Name like '%UEMS%' or Name like '%ManageEngine%'" -ErrorAction SilentlyContinue |
                Select-Object Name, IdentifyingNumber | Format-List | Out-String
              "--- uninstall entries mentioning ManageEngine/Zoho/Central ---"
              Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
                Where-Object { "$($_.DisplayName) $($_.Publisher)" -match 'Manage|Zoho|Central|UEMS' } |
                Select-Object DisplayName, Publisher, PSChildName | Format-List | Out-String
          register: me_uninst_diag
          changed_when: false
          failed_when: false
          when: (me_uninst_lookup.stdout | trim) == 'NOT_FOUND'

        - name: Show diagnostics
          ansible.builtin.debug:
            var: me_uninst_diag.stdout_lines
          when: (me_uninst_lookup.stdout | trim) == 'NOT_FOUND'

        - name: Fail if no uninstall entry was found
          ansible.builtin.fail:
            msg: >-
              The agent service exists but no matching uninstall entry was found in the registry
              (see the diagnostics above for what is installed). The agent may not register in
              Programs and Features; remove it with ManageEngine's AgentCleanupTool or the
              console, then run the install again.
          when: (me_uninst_lookup.stdout | trim) == 'NOT_FOUND'

        - name: Build the uninstall command
          # Endpoint Central's agent protection requires the one-time password
          # shown in the console (Agent > Computers > View OTP) to uninstall.
          # me_uninstall_template ({target} = product code or uninstall string,
          # {otp}) comes from the backend and can be overridden with the
          # ME_WIN_UNINSTALL_CMD environment variable there.
          ansible.builtin.set_fact:
            me_uninstall_final: >-
              {{ (me_uninstall_exe_template if (me_uninst_lookup.stdout | trim).startswith('EXE::') else me_uninstall_template)
                 | replace('{target}', (me_uninst_lookup.stdout | trim).split('::', 1)[1])
                 | replace('{otp}', me_uninstall_otp | default('')) }}
          no_log: true

        - name: Run the uninstaller
          # no_log hides the OTP; the exit code is checked in the next task.
          ansible.windows.win_shell:
            _raw_params: "{{ me_uninstall_final }}"
          register: me_uninstall
          async: 600
          poll: 10
          changed_when: true
          failed_when: false
          no_log: true

        - name: Fail if the uninstaller returned an error
          ansible.builtin.fail:
            msg: >-
              Uninstall command failed with exit code {{ me_uninstall.rc | default('unknown') }}.
              Check that the OTP is current and correct (Endpoint Central: Agent > Computers > View OTP).
          when: me_uninstall.rc | default(1) not in [0, 1605, 1641, 3010]

        - name: Wait for the agent service to be removed
          ansible.windows.win_service_info:
            name: "{{ me_service_name }}"
          register: me_service_after
          retries: 24
          delay: 5
          until: not (me_service_after.exists | default(false))

        - name: Report success
          ansible.builtin.debug:
            msg: "ManageEngine UEMS Agent uninstalled."

    - name: Report that the agent was not installed
      ansible.builtin.debug:
        msg: "ManageEngine UEMS Agent is not installed — nothing to uninstall."
      when: not (me_service_before.exists | default(false))
