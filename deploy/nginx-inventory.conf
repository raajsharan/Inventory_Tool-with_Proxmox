server {
    listen 80;
    server_name _;

    # Frontend (Vite build output)
    root /New_Code/frontend/dist;
    index index.html;

    # Increase upload limit for Excel imports
    client_max_body_size 12M;

    # API reverse proxy
    location /api/ {
        proxy_pass         http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Software install (WinRM/WMI/PsExec/SSH) can run up to 300s per
        # method on an explicit (non-auto) method — 120s was killing the
        # proxy connection with a bare 504 well before the backend's own
        # install timeout, even when the install was still in progress.
        proxy_read_timeout 300s;
    }

    # Health check passthrough (optional)
    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
    }

    # WebSocket — real-time discovery-failure alerts (AlertBell). Needs the
    # Upgrade/Connection headers explicitly; the API location's proxy_pass
    # above doesn't set these and would otherwise 400 on the handshake.
    location /ws/ {
        proxy_pass         http://127.0.0.1:4000/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — all non-file routes go to index.html.
    # No $uri/ directory fallback here: Vite's own build output directory is
    # literally named "assets", so a directory-match against a client-side
    # route of the same name (/assets) hits that folder (no index.html inside
    # it) and nginx returns 403 instead of falling through to the SPA.
    location / {
        try_files $uri /index.html;
    }

    # Cache hashed assets aggressively
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
}
